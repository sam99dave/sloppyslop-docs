# vLLM Architecture Deep Dive (Mermaid Diagrams)

A set of deep-technical architecture diagrams of this tree (vLLM `main`, as of Oct 2026).
Use them to navigate the code: every diagram names exact files, classes, and methods.

> Note: this tree is newer than most published vLLM docs. The legacy v0 engine is gone
> (`vllm/engine/llm_engine.py` is a 2-line alias into `vllm/v1/`), the classic
> `serving_chat.py` monolith is split per-endpoint, and `TokenizerGroup`/`InputRegistry`
> have been replaced by the `vllm/renderers/` + `vllm/tokenizers/` architecture.

## Reading order

| # | Diagram | Question it answers |
|---|---------|----------------------|
| 1 | [System Overview](01-system-overview.md) | What are the layers, from HTTP request to GPU kernel? |
| 2 | [Process Topology & IPC](02-process-topology.md) | Which processes exist, and how do they talk (ZMQ)? |
| 3 | [Request Lifecycle](03-request-lifecycle.md) | Trace one streaming chat request end-to-end. |
| 4 | [Frontend & Serving Layer](04-frontend-serving.md) | How is `vllm serve` assembled — routers, renderers, parsers? |
| 5 | [Engine Core](05-engine-core.md) | What runs inside the EngineCore process (busy loop, scheduling, exec)? |
| 6 | [Scheduler & KV Cache](06-scheduler-kv-cache.md) | How are batches built, and how is paged KV memory managed? |
| 7 | [Execution Stack](07-execution-stack.md) | Executor → Worker → GPUModelRunner → CUDA graphs / torch.compile. |
| 8 | [Models, Attention & Distributed](08-attention-distributed.md) | Model registry, layers, attention backend selection, TP/PP/DP/EP, KV disagg. |
| 9 | [Sampling, Spec Decode, Structured Output & LoRA](09-sampling-spec-decode.md) | What happens to logits after the forward pass? |
| 10 | [Config, Platforms & Plugins](10-config-platform-plugins.md) | How is `VllmConfig` assembled and how does the system extend? |

## How the diagrams connect

```mermaid
flowchart TD
    subgraph Legend[" "]
        direction LR
        L1[Diagram 1: System Overview]
        L2[Diagrams 2-3: Processes & Lifecycle]
        L3[Diagrams 4-5: Frontend & Engine Core]
        L4[Diagrams 6-9: Engine internals]
        L5[Diagram 10: Cross-cutting]
        L1 --> L2 --> L3 --> L4
        L5 -.-> L3
        L5 -.-> L4
    end
```

- Diagrams 1–3 give the **map** (processes, IPC, one request's journey).
- Diagrams 4–9 **zoom into** each layer, in the order a request passes through them.
- Diagram 10 is **cross-cutting** (config assembly, platform detection, plugin entry points)
  and applies to everything else.

## Repo-to-diagram quick lookup

| Repo path | Covered in |
|---|---|
| `vllm/entrypoints/` (CLI, launchers, serving routers) | 1, 2, 4 |
| `vllm/renderers/`, `vllm/tokenizers/`, `vllm/parser/`, `vllm/tool_parsers/`, `vllm/reasoning/` | 4 |
| `vllm/v1/engine/` (AsyncLLM, LLMEngine, EngineCore, core_client, processors) | 2, 3, 5 |
| `vllm/v1/core/sched/` (Scheduler) | 6 |
| `vllm/v1/core/` (KVCacheManager, coordinator, BlockPool) | 6 |
| `vllm/v1/executor/`, `vllm/v1/worker/` | 7 |
| `vllm/compilation/`, `vllm/v1/cudagraph_dispatcher.py` (CUDA graphs, torch.compile) | 7 |
| `vllm/model_executor/` (models, layers, loaders) | 8 |
| `vllm/v1/attention/` (attention backends) | 8 |
| `vllm/distributed/` (parallel_state, comm ops, kv_transfer) | 8 |
| `vllm/v1/sample/`, `vllm/v1/spec_decode/`, `vllm/v1/structured_output/`, `vllm/lora/` | 9 |
| `vllm/config/`, `vllm/platforms/`, `vllm/plugins/`, `vllm/v1/metrics/` | 10 |
| `csrc/`, `vllm/layers/` (kernels) | 7, 8 (referenced) |

## Caveats

- Line numbers drift; file paths and class names are the stable anchors.
- Both a V1 (`vllm/v1/worker/gpu_model_runner.py`) and a V2
  (`vllm/v1/worker/gpu/model_runner.py`) model runner exist; V2 is selected by
  `VLLM_USE_V2_MODEL_RUNNER`. Diagrams call out the differences where they matter.

# openpilot Architecture Diagrams

Mermaid architecture diagrams for the openpilot codebase. View them with any
Mermaid renderer (GitHub, VS Code Mermaid extension, mermaid.live, mkdocs with
mermaid, etc.) — each file is a standalone `.mmd` diagram.

## Diagram index

| # | File | What it shows |
|---|------|---------------|
| 1 | [01-system-overview.mmd](01-system-overview.mmd) | **Start here.** The big picture: vehicle, comma device hardware, AGNOS OS, the openpilot software stack, and the comma cloud. |
| 2 | [02-process-architecture.mmd](02-process-architecture.mmd) | The manager: boot chain, process types (`PythonProcess` / `NativeProcess` / `DaemonProcess`), the full process table and when each process runs (onroad / offroad / driver view / notCar). |
| 3 | [03-messaging.mmd](03-messaging.mmd) | The nervous system: `cereal` (Cap'n Proto `Event` union + service registry), `msgq` (zero-copy shared-memory pub/sub), `visionipc` (zero-copy camera frames), the `params` store, and the ZMQ `bridge` used for PC development. |
| 4 | [04-onroad-data-flow.mmd](04-onroad-data-flow.mmd) | **Master data-flow graph.** End-to-end message flow while driving: sensors in, actuators out. Edge labels are cereal message names. |
| 5 | [05-vision-model-pipeline.mmd](05-vision-model-pipeline.mmd) | Camera frames: `camerad` → `visionipc` → `modeld` (tinygrad NNs) → `modelV2` / `cameraOdometry`, plus the driver-monitoring path and the logging path. |
| 6 | [06-controls-stack.mmd](06-controls-stack.mmd) | Planning & control internals: `selfdrived` (state machine / events / alerts), `controlsd` (lateral + longitudinal loops), `card`, `plannerd` (MPC), `radard` (radar/vision fusion). |
| 7 | [07-car-abstraction.mmd](07-car-abstraction.mmd) | How openpilot supports 300+ cars: `card` daemon, car fingerprinting (VIN → FW versions → CAN fingerprint), and the per-brand port structure in the `opendbc` submodule. |
| 8 | [08-safety-path.mmd](08-safety-path.mmd) | Safety architecture: the 5-layer defense-in-depth actuation path, `pandad` ↔ panda MCU, and the MISRA-style C safety code in `opendbc/safety` compiled into the panda firmware. |
| 9 | [09-locationd-pipeline.mmd](09-locationd-pipeline.mmd) | State estimation: the `locationd` pose EKF (rednose-generated) and its siblings (`calibrationd`, `paramsd`, `torqued`, `lagd`) plus the GNSS pipelines. |
| 10 | [10-offroad-cloud.mmd](10-offroad-cloud.mmd) | Offroad world: `hardwared` device health, the UI, `athenad` cloud link, `uploader`, `updated` OTA, and comma body / teleop (`webrtcd`, `joystickd`). |
| 11 | [11-ui.mmd](11-ui.mmd) | The raylib UI process: subscriptions, derived UI state, onroad widgets, offroad screens, and audio/feedback processes. |

## How the diagrams connect

The diagrams form a zoom-in hierarchy. 1 is the 10,000-foot view; 4 is the
complete runtime picture; 5–11 are subsystem deep-dives that each expand one
cluster of 4.

```
01 system overview
   └── 02 process architecture      (expands: "Managed processes" + manager)
       └── 03 messaging             (expands: how everything talks: msgq, visionipc, params)
           └── 04 onroad data flow  (expands: the whole onroad runtime; master graph)
               ├── 05 vision & model pipeline   (expands: camerad / modeld / dmonitoring / logging)
               ├── 06 controls stack            (expands: selfdrived / controlsd / card / plannerd / radard)
               │       ├── 07 car abstraction    (expands: card + opendbc car ports, fingerprinting)
               │       └── 08 safety path         (expands: card→pandad→panda actuation chain)
               ├── 09 locationd pipeline         (expands: live* state estimators + GNSS)
               ├── 10 offroad & cloud            (expands: hardwared, athenad, uploader, OTA, teleop)
               └── 11 UI                         (expands: the ui process)
```

Cross-references inside the diagrams use "see NN" notes (e.g. the safety
diagram points back at the controls stack).

## Key concepts needed to read the diagrams

- **Processes.** Everything except the boot scripts is a *process* supervised
  by the `manager` (see `system/manager/process_config.py` for the source of
  truth). Python processes, native binaries (`camerad`, `loggerd`, `encoderd`,
  native `pandad`), and one detached daemon (`manage_athenad`).
- **cereal messages.** Every arrow labeled with a message name
  (`carState`, `modelV2`, `livePose`, …) is a pub/sub edge on the msgq bus,
  defined in `cereal/log.capnp` and registered in `cereal/services.py`.
- **visionipc.** Camera frames bypass the normal message bus and travel
  through dedicated zero-copy buffers (`VISION_STREAM_ROAD`, `WIDE_ROAD`,
  `DRIVER`). Thick arrows (`==>`) in the diagrams indicate frame streams.
- **params.** Dashed arrows indicate the persistent key-value params store
  (`common/params.py`), used for slow / startup data such as `CarParams`,
  `ControlsReady`, and `IsOnroad` — notably the handshake that lets `pandad`
  switch the panda MCU into the car-specific safety mode.
- **onroad vs offroad.** `hardwared` publishes `deviceState.started`; the
  manager uses it to decide which processes run. Ignition comes from the panda
  (`pandaStates`).

## Rendering

```sh
# CLI render to SVG/PNG (requires @mermaid-js/mermaid-cli)
npx -y @mermaid-js/mermaid-cli -i docs/diagrams/04-onroad-data-flow.mmd -o out.svg

# Or paste the file contents into https://mermaid.live
```

## Maintenance notes

- Process names and run conditions in 02 mirror
  `system/manager/process_config.py`; message lists in 04–06 mirror the
  `SubMaster` / `PubMaster` constructors in each daemon's source.
- The edge labels are the actual cereal service names — grep
  `cereal/services.py` to check frequencies and queue sizes.
- If you add a process or a message, update 02 and 04 first; the subsystem
  diagrams (05–11) are refinements of those two.

<script type="text/markdown" data-path="prefect/2026-10-14-architecture-reference.md">
# Prefect Architecture Reference (2026-10-14)

Diagrams + file references for the systems architecture. Each section is self-contained; use the reference index at the bottom to retrieve details without re-reading the whole doc.

---

## 1. High-Level System Diagram

```mermaid
flowchart TB
    subgraph USERS["User Surfaces"]
        SDK["Python SDK<br/>@flow / @task<br/>src/prefect/flows.py, tasks.py"]
        CLI["CLI (cyclopts)<br/>src/prefect/cli/"]
        UI["React UI (ui-v2)<br/>REST only, openapi-fetch"]
    end

    subgraph EXEC["Execution Plane (client-side)"]
        FE["Flow Engine<br/>flow_engine.py"]
        TE["Task Engine<br/>task_engine.py"]
        W["Workers (work pools)<br/>workers/base.py"]
        R["Runner (prefect serve)<br/>runner/runner.py"]
        TW["TaskWorker (deferred tasks)<br/>task_worker.py"]
        B["Bundles<br/>cloudpickle flow → subprocess<br/>bundles/"]
    end

    subgraph SERVER["Orchestration Plane — src/prefect/server/"]
        API["FastAPI app<br/>api/server.py::create_app"]
        ORCH["Orchestration rules<br/>orchestration/rules.py, core_policy.py"]
        SVC["Docket perpetual services<br/>scheduler, late-runs, foreman,<br/>cancellation, vacuums"]
        EVT["Event pipeline<br/>events/ → triggers → actions"]
        TQ["TaskQueue<br/>server/task_queue.py"]
    end

    subgraph DATA["Data Plane"]
        DB[("SQLAlchemy ORM<br/>server/database/orm_models.py<br/>PG + SQLite (lockstep)")]
        BLK[("Blocks: server-persisted config<br/>blocks/core.py")]
        RES[("Result storage blocks<br/>results.py ResultStore")]
    end

    SDK --> FE
    SDK --> TE
    CLI --> API
    UI -->|REST| API
    API --> ORCH --> DB
    FE -->|"REST: propose states"| API
    TE -->|"task_run.* events (WS)"| EVT
    W -->|"WS worker channel + REST"| API
    API -->|"scheduled flow runs"| W
    W --> B --> FE
    R -->|"poll + subprocess"| API
    TW -->|subscribe| TQ
    TQ -->|"scheduled task runs"| TW
    SVC --> DB
    EVT --> DB
    BLK --> DB
```

**The core architectural split:** flow-run states are *proposed to the server* (rules ACCEPT/REJECT/WAIT/ABORT); task-run states are *advanced locally* by the task engine and only *reported* via `prefect.task_run.*` events, which `TaskRunRecorder` upserts into the DB. See `src/prefect/AGENTS.md:28-29`.

---

## 2. Flow Execution — Lifecycle Sequence

```mermaid
sequenceDiagram
    participant U as User code
    participant F as @flow (flows.py)
    participant FE as FlowRunEngine (flow_engine.py)
    participant C as PrefectClient (client/)
    participant S as Server API (server/api/)
    participant OR as Orchestration rules (server/orchestration/)

    U->>F: my_flow(args)
    F->>FE: run_flow (flow_engine.py:2202)
    Note over FE: dispatch: sync/async × plain/generator<br/>(flow_engine.py:2070-2199)
    FE->>C: create_flow_run
    C->>S: POST /flow_runs
    FE->>S: propose Running → POST /flow_runs/{id}/set_state
    S->>OR: run rules (CoreFlowPolicy)
    alt ACCEPT
        OR-->>FE: validated state
    else REJECT
        OR-->>FE: server's state (may raise Pause)
    else WAIT
        OR-->>FE: retry after delay_seconds
    else ABORT
        OR-->>FE: raise Abort

## 9. Rules of Thumb (from AGENTS.md contracts)

1. **Flow states → server; task states → local + events.** Never bypass server orchestration for flow runs.
2. **Sync/async engine paths must stay in lockstep** — mirror every behavior change.
3. **SQLite and PostgreSQL migrations must stay in lockstep** — CI tests both.
4. **`force=True` routes through `MinimalFlowPolicy`** — not a true bypass (still `PreventResultDataLoss`).
5. **Perpetual services use `Perpetual(automatic=True)`** and Docket keys `"<service>:<entity-id>"` to prevent duplicate enqueues.
6. **Every result write must call `mark_persisted()`** or state metadata is silently dropped.
7. **Server vs client schemas stay separate** (`server/schemas/` vs `client/schemas/`).
8. **Auth token comparisons use `hmac.compare_digest`** (CSRF, basic auth, WS auth).

    while (i < lines.length && lines[i].trim() &&
           !/^(#{1,6}\s|```|>|-\s|\*\s|\d+\.\s|\s*\|)/.test(lines[i])) {
      buf.push(lines[i].trim()); i++;
    }
    html += '<p>' + buf.map(inline).join(' ') + '</p>';
  }
  return html;
}

/* ---------- viewer ---------- */
function isDocActive() { return active >= 0 && all[active].type === 'doc'; }

function load(i) {
  if (i < 0 || i >= all.length) return;
  active = i;
  const d = all[i];
  titleEl.innerHTML = `${esc(d.file)} <span>· ${esc(d.proj)}</span>`;
  phEl.style.display = 'none';
  buildList(searchEl.value);

  if (d.type === 'doc') {
    imgEl.style.display = 'none';
    docEl.innerHTML = '<div class="inner">' + mdRender(MD[d.path] || `*Not found: ${esc(d.path)}*`) + '</div>';
    docEl.style.display = 'block';
    docEl.scrollTop = 0;
    document.getElementById('zoom-in').disabled = true;
    document.getElementById('zoom-out').disabled = true;
    document.getElementById('fit').disabled = true;
  } else {
    docEl.style.display = 'none';
    imgEl.src = encodeURI(d.path);
    imgEl.style.display = 'block';
    document.getElementById('zoom-in').disabled = false;
    document.getElementById('zoom-out').disabled = false;
    document.getElementById('fit').disabled = false;
    scale = 1; tx = 0; ty = 0;
    imgEl.onload = () => requestAnimationFrame(fit);
    if (imgEl.complete && imgEl.naturalWidth) fit();
  }
}

function fit() {
  if (isDocActive() || !imgEl.naturalWidth) return;
  const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
  fitScale = Math.min(stageEl.clientWidth / iw, stageEl.clientHeight / ih) * 0.95;
  scale = fitScale; tx = 0; ty = 0;
  apply();
}

function apply() {
  imgEl.style.transform =
    `translate(-50%, -50%) translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomLbl.textContent = Math.round(scale * 100) + '%';
}

function zoomBy(f, cx, cy) {
  if (isDocActive()) return;
  const ns = Math.min(MAX, Math.max(MIN, scale * f));
  if (cx !== undefined) {
    // keep the point under the cursor stationary
    const rx = cx - stageEl.clientWidth / 2;
    const ry = cy - stageEl.clientHeight / 2;
    tx = rx - (rx - tx) * (ns / scale);
    ty = ry - (ry - ty) * (ns / scale);
  }
  scale = ns;
  apply();
}

/* ---------- events ---------- */
document.getElementById('zoom-in').onclick  = () => zoomBy(1.25);
document.getElementById('zoom-out').onclick = () => zoomBy(0.8);
document.getElementById('fit').onclick = fit;
document.getElementById('prev').onclick = () => load(prevIdx());
document.getElementById('next').onclick = () => load(nextIdx());
document.getElementById('open').onclick = () => {
  if (active >= 0) window.open(encodeURI(all[active].path), '_blank');
};
document.getElementById('sb-toggle').onclick = toggleSidebar;

function toggleSidebar() {
  if (document.activeElement === searchEl) searchEl.blur();
  document.body.classList.toggle('sb-collapsed');
  // stage geometry changed -> refit after the transition settles
  clearTimeout(rt);
  rt = setTimeout(() => { if (active >= 0) fit(); }, 230);
}

document.getElementById('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

stageEl.addEventListener('wheel', e => {
  if (isDocActive()) return; // let the readme scroll natively
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - stageEl.getBoundingClientRect().left,
                                         e.clientY - stageEl.getBoundingClientRect().top);
}, { passive: false });

let dragging = false, sx = 0, sy = 0;
stageEl.addEventListener('mousedown', e => {
  if (isDocActive()) return; // allow text selection in readmes
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stageEl.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy; apply();
});
window.addEventListener('mouseup', () => {
  dragging = false; stageEl.classList.remove('panning');
});

function prevIdx() { return active > 0 ? active - 1 : all.length - 1; }
function nextIdx() { return active < all.length - 1 ? active + 1 : 0; }

window.addEventListener('keydown', e => {
  if (e.target === searchEl) {
    if (e.key === 'Escape') { searchEl.blur(); }
    return;
  }
  switch (e.key) {
    case '/': e.preventDefault(); searchEl.focus(); searchEl.select(); break;
    case 'ArrowLeft':  load(prevIdx()); break;
    case 'ArrowRight': load(nextIdx()); break;
    case '+': case '=': zoomBy(1.25); break;
    case '-': zoomBy(0.8); break;
    case '0': fit(); break;
    case 's': case 'S': toggleSidebar(); break;
    case 'f': case 'F':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      break;
  }
});

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (active >= 0) fit(); }, 150); });

searchEl.addEventListener('input', () => buildList(searchEl.value));

buildList();
</script>
</body>
</html>
